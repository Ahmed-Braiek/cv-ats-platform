name: Backend checks
on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/worker/**'
      - 'supabase/functions/process-cv/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'services/worker/**'
      - 'supabase/functions/process-cv/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  gemini-routing-unit:
    name: Gemini key rotation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test three-key Gemini selector
        run: node --experimental-strip-types --test supabase/functions/process-cv/gemini_key_rotation.test.mjs

  worker-unit:
    name: Worker scoring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check worker source syntax
        run: |
          node --check services/worker/src/index.mjs
          node --check services/worker/src/gemini.mjs
          node --check services/worker/src/scoring.mjs
      - name: Execute deterministic scorer tests
        run: node --test services/worker/test/*.test.mjs

  api-build:
    name: Build NestJS API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned top-level dependencies
        run: npm install --no-audit --no-fund
      - name: Build API
        run: npm run build
