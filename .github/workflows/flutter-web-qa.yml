name: Flutter Web QA

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-web-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-web-qa.yml'

permissions:
  contents: read

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Initialize web platform
        run: flutter create --platforms=web --project-name cv_ats_mobile .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build Flutter web
        run: flutter build web --release
