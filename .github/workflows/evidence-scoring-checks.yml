name: Evidence scoring checks
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/process-cv/**"
      - ".github/workflows/evidence-scoring-checks.yml"
  pull_request:
    paths:
      - "supabase/functions/process-cv/**"
      - ".github/workflows/evidence-scoring-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Unit-test deterministic scoring and grounding
        run: node --experimental-strip-types --test supabase/functions/process-cv/scoring.test.mjs
