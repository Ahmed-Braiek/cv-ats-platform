name: Flutter Android checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Initialize Android platform
        run: flutter create --platforms=android --project-name cv_ats_mobile .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Flutter widget tests
        run: flutter test
      - name: Build debug Android APK
        env:
          CV_ATS_API_URL: https://cv-ats-api.vercel.app
          CV_ATS_ANALYSIS_ENABLED: 'true'
          SUPABASE_URL: https://uqtyxhkevnyjvhwdgkyh.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_MlF4aPhLVfhgv5h_Cc2K_Q_20CiDaWw
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$CV_ATS_API_URL"
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=CV_ATS_API_URL="$CV_ATS_API_URL" \
            --dart-define=CV_ATS_ANALYSIS_ENABLED="$CV_ATS_ANALYSIS_ENABLED"
      - name: Retain test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-ats-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
