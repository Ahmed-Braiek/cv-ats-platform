<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email — CV ATS</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f5f8fd;font-family:Arial,Helvetica,sans-serif;color:#13213b">
    <div style="max-width:520px;margin:auto;border-radius:18px;overflow:hidden;background:#fff;border:1px solid #e4ebf5">
      <div style="background:#0e1832;padding:28px;color:#fff">
        <p style="font-size:13px;letter-spacing:2px;font-weight:700;margin:0 0 18px">cv/ats &nbsp;·&nbsp; CAREER STUDIO</p>
        <h1 style="font-size:28px;line-height:1.2;margin:0;font-weight:800">One step closer.</h1>
        <p style="font-size:14px;line-height:1.6;color:#cbd6e6;margin:12px 0 0">Confirm your email address to activate your account.</p>
      </div>
      <div style="padding:30px 26px">
        <p style="font-size:15px;line-height:1.6">Enter this verification code in the CV ATS app:</p>
        <div style="background:#edf2fe;border:1px solid #d5def9;border-radius:14px;text-align:center;padding:22px 12px;margin:24px 0">
          <span style="letter-spacing:8px;font-size:32px;font-weight:800;color:#315beb">{{ .Token }}</span>
        </div>
        <p style="font-size:13px;line-height:1.7;color:#73829a">Copy all six digits and paste them into the verification field. If you did not create an account, you can safely ignore this email.</p>
      </div>
    </div>
  </body>
</html>
